# Persistance : un même client (IP source) va toujours sur le même serveur
upstream pool_web {
    ip_hash;
    server web1:80;
    server web2:80;
}

server {
    listen 80;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}
