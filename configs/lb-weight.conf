# Poids : web1 reçoit 3 fois plus de requêtes que web2 (équivalent du Ratio F5)
upstream pool_web {
    server web1:80 weight=3;
    server web2:80;
}

server {
    listen 80;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}
