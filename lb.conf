# Pool de serveurs (équivalent d'un pool F5)
upstream pool_web {
    server web1:80;
    server web2:80;
}

# VIP en HTTP
server {
    listen 80;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}

# VIP en HTTPS : SSL offloading
# Le LB déchiffre, puis parle en HTTP aux serveurs
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    location / {
        proxy_pass http://pool_web;
        proxy_connect_timeout 2s;
    }
}
