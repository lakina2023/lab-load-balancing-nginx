services:
  web1:
    image: nginx:alpine
    volumes:
      - ./web1:/usr/share/nginx/html:ro
  web2:
    image: nginx:alpine
    volumes:
      - ./web2:/usr/share/nginx/html:ro
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web1
      - web2
